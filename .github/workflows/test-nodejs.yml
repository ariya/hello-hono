name: Test with Node.js

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    strategy:
      matrix:
        nodejs-version: [24, 22, 20]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.nodejs-version }}
        uses: actions/setup-node@v7
        with:
          nodejs-version: ${{ matrix.nodejs-version }}

      - run: npm ci

      - run: npm start &

      - name: Run the health check validation
        run: while ! curl -s 'http://localhost:3000/health' | grep 'OK'; do sleep 1; done
        timeout-minutes: 3
